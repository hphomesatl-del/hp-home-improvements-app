[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "backend"
builder = "dockerfile"

[services.deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
