services:
  - type: web
    name: hp-home-improvements-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5555
      - key: CORS_ORIGIN
        value: https://frontend-gold-ten-70.vercel.app
      - key: JWT_SECRET
        value: HPHomeImprovements2026SecretKey!VerySafe
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        value: postgres
      - key: DB_NAME
        value: hp_home_improvements
      - key: DB_PORT
        value: "5432"

  - type: pserv
    name: hp-home-improvements-db
    plan: free
