services:
  - type: web
    name: hp-home-improvements-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5555
      - key: CORS_ORIGIN
        value: https://frontend-gold-ten-70.vercel.app
      - key: JWT_SECRET
        value: HPHomeImprovements2026SecretKey!VerySafe
      - key: DATABASE_URL
        fromDatabase:
          name: hp-home-improvements-db
          property: connectionString

databases:
  - name: hp-home-improvements-db
    databaseName: hp_home_improvements
    user: postgres
    plan: free
